<!-- Floating WhatsApp / Quick Contact Widget -->
<div class="kneo-wa-widget" id="kneoWaWidget">
  <button class="kneo-wa-btn" id="kneoWaBtn" type="button" aria-label="Contact Now" title="Contact Now / Send Message">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
    </svg>
    <span class="kneo-wa-pulse" aria-hidden="true"></span>
  </button>
</div>

<!-- WhatsApp Quick Contact Modal -->
<div class="kneo-modal-backdrop" id="kneoLeadModal" role="dialog" aria-modal="true" aria-labelledby="kneoModalTitle" hidden>
  <div class="kneo-modal-card">
    <div class="kneo-modal-header">
      <div class="kneo-modal-header-info">
        <div class="kneo-modal-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
          </svg>
        </div>
        <div>
          <h3 class="kneo-modal-title" id="kneoModalTitle">Contact Now</h3>
          <p class="kneo-modal-sub">We'll respond quickly within one business day!</p>
        </div>
      </div>
      <button class="kneo-modal-close" type="button" aria-label="Close modal" id="kneoModalClose">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="kneo-modal-body">
      {{INCLUDE:lead-form}}
    </div>
  </div>
</div>
