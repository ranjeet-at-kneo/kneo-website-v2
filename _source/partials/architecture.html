      <!-- ============================================================
           MAPP architecture — RADIAL layout. Home page only.
           The MAPP page pulls in architecture-classic.html instead, and
           the two are meant to differ. The page supplies its own heading
           above this block, so there is none here.

           TWO GEOMETRIES, ONE DIAGRAM.
           A radial diagram has a fixed aspect ratio, so a single SVG
           cannot both fill a desktop and stay legible on a phone — at
           360px the landscape version renders its labels at about 5px.
           The reference this came from solved that with a sideways
           scroll and a "swipe" hint; this does not, because the diagram
           is meant to fit. Instead there are two SVGs and a media query
           picks one:

             .radial__wide   landscape, full ring    >= 1024px
             .radial__tall   portrait, stacked ring   < 1024px  (capped
                             at 460px wide so it cannot balloon on a tablet)

           display:none removes the unused one from the accessibility
           tree as well as from the page, so screen readers get exactly
           one. Both carry the same six module links.

           GEOMETRY — recompute if you move anything.
           wide: viewBox 1160x890, core (580,430) r88, ring r300.
           tall: viewBox  380x900, core (190,470) r62, ring r148,

                 ring, so the outermost edge lands at x=370.2 inside a
                 380 box — a 9.8 margin on each side.
           ============================================================ -->
