<!-- Theme + scroll bootstrap: runs before first paint, so there is no flash of
     the wrong theme and no jump from a restored scroll position. -->
<script>
(function(){
  var d=document.documentElement;
  d.classList.add('js');
  /* A stored choice wins. With none, follow the browser's colour scheme.
     This has to resolve here, before first paint, or the page would flash
     the wrong theme on every load. */
  try{
    var t=localStorage.getItem('kneo-theme');
    if(t!=='light'&&t!=='dark'){
      t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    }
    d.setAttribute('data-theme',t);
  }catch(e){d.setAttribute('data-theme','dark');}
  /* The brand intro plays once per visit, on whichever page is entered first.
     The timer is a failsafe: if main.js never loads or throws, the overlay
     still clears itself, so a scripting failure can never trap the page. */
  try{if(sessionStorage.getItem('kneo-intro')==='1'){d.classList.add('pl-done');}}
  catch(e){d.classList.add('pl-done');}
  setTimeout(function(){d.classList.add('pl-done');},8000);
  /* Load and reload start at the top of the page. Back/forward is left on the
     browser's default so a reader returning to a list lands where they were. */
  try{
    if('scrollRestoration' in history){
      var n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];
      var k=n?n.type:(performance.navigation&&performance.navigation.type===2?'back_forward':'navigate');
      if(k!=='back_forward'){history.scrollRestoration='manual';}
    }
  }catch(e){}
})();
</script>
