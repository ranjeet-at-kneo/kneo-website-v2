<form class="form kneo-lead-form" novalidate data-kneo-lead-form>
  <!-- Honeypot for bot protection -->
  <div style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden" aria-hidden="true">
    <label>Website (leave blank)</label>
    <input type="text" name="website" tabindex="-1" autocomplete="off">
  </div>

  <div class="form__row">
    <div class="field">
      <label>Full Name <span class="req">*</span></label>
      <input name="name" type="text" autocomplete="name" required placeholder="Your Good Name">
      <span class="field__error">Please enter your name.</span>
    </div>
    <div class="field">
      <label>Email Address <span class="req">*</span></label>
      <input name="email" type="email" autocomplete="email" required placeholder="name@company.com">
      <span class="field__error">Please enter a valid email address.</span>
    </div>
  </div>

  <div class="field">
    <label>Company</label>
    <input name="company" type="text" autocomplete="organization" placeholder="Your Company">
  </div>

  <!-- Phone with International Country Code -->
  <div class="field">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <label>Phone Number <span class="req">*</span></label>
        <span style="font-size:0.75rem;color:var(--text-3)">Country code required</span>
      </div>
      <div class="kneo-phone-group">
        <div class="field--select kneo-phone-code-wrap">
          <select name="country_code" class="kneo-phone-code" aria-label="Country Code">
            <option value="+91" selected>🇮🇳 +91 (India)</option>
            <option value="+1">🇺🇸 +1 (USA / CA)</option>
            <option value="+44">🇬🇧 +44 (UK)</option>
            <option value="+971">🇦🇪 +971 (UAE)</option>
            <option value="+49">🇩🇪 +49 (Germany)</option>
            <option value="+65">🇸🇬 +65 (Singapore)</option>
            <option value="+966">🇸🇦 +966 (Saudi Arabia)</option>
            <option value="+61">🇦🇺 +61 (Australia)</option>
            <option value="+974">🇶🇦 +974 (Qatar)</option>
            <option value="+968">🇴🇲 +968 (Oman)</option>
            <option value="+965">🇰🇼 +965 (Kuwait)</option>
            <option value="+973">🇧🇭 +973 (Bahrain)</option>
            <option value="+60">🇲🇾 +60 (Malaysia)</option>
            <option value="+81">🇯🇵 +81 (Japan)</option>
          </select>
        </div>
        <input name="phone" type="tel" autocomplete="tel" required placeholder="90282 36809" class="kneo-phone-input">
      </div>
      <span class="field__error">Please enter your mobile number.</span>
    </div>

  <div class="field field--select">
    <label>Service / Product Interest</label>
    <select name="service">
      <option value="">Select a service or product</option>
      <option value="PLC Engineering Solutions">PLC Engineering Solutions</option>
      <option value="Turnkey Industrial Automation">Turnkey Industrial Automation</option>
      <option value="SCADA & Ignition Solutions">SCADA &amp; Ignition Solutions</option>
      <option value="MAPP MES & IIoT Platform">MAPP MES &amp; IIoT Platform</option>
      <option value="MAPP EYE (OEE & Downtime)">MAPP EYE (OEE &amp; Downtime)</option>
      <option value="MAPP ZEN (Quality 4.0)">MAPP ZEN (Quality 4.0)</option>
      <option value="MAPP TRAIL (Track & Trace)">MAPP TRAIL (Track &amp; Trace)</option>
      <option value="MAPP VITA (Maintenance & CBM)">MAPP VITA (Maintenance &amp; CBM)</option>
      <option value="MAPP ADEPT (AI Scheduling)">MAPP ADEPT (AI Scheduling)</option>
      <option value="PFMEA Software">PFMEA Software</option>
      <option value="Auto Ballooning Software">Auto Ballooning Software</option>
      <option value="Drawing Inspection Workflow">Drawing Inspection Workflow</option>
      <option value="MAPP Vision (Automated Inspection)">MAPP Vision (Automated Inspection)</option>
      <option value="Virtual Commissioning & Digital Twin">Virtual Commissioning &amp; Digital Twin</option>
      <option value="Consulting & Training">Consulting &amp; Training</option>
      <option value="Other">Other Requirement</option>
    </select>
  </div>

  <div class="field">
    <label>Message / Automation Requirements <span class="req">*</span></label>
    <textarea name="message" rows="4" required placeholder="Tell us about your automation requirements..."></textarea>
    <span class="field__error">Please enter your message.</span>
  </div>

  <div class="form__status" aria-live="polite"></div>

  <button class="btn btn--primary btn--lg kneo-submit-btn" type="submit">
    <span class="btn__text">Submit</span>
    <svg class="btn__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M4 12 12 4M6 4h6v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</form>
